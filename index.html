<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BUMDes Digital | Cikahuripan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.7/css/dataTables.bootstrap5.min.css">
    <style>
        :root { --primary-green: #1b5e20; --accent-blue: #0000FF; }
        body { background-color: #f4f7f6; font-family: 'Segoe UI', sans-serif; }
        .sidebar { width: 260px; height: 100vh; position: fixed; background: var(--primary-green); color: white; padding-top: 20px; z-index: 1000; }
        .content { margin-left: 260px; padding: 30px; min-height: 100vh; }
        .menu-section { display: none; }
        .active-section { display: block; }
        .nav-link { color: #c8e6c9; cursor: pointer; padding: 12px 20px; display: block; text-decoration: none; }
        .nav-link.active { background: var(--accent-blue); color: white; }
        @media (max-width: 768px) { .sidebar { display: none; } .content { margin-left: 0; padding: 15px; } }
    </style>
</head>
<body>

<div id="main-app">
    <div class="sidebar">
        <div class="text-center mb-4"><h6 class="text-white fw-bold">BUMDes Cikahuripan</h6></div>
        <nav>
            <a class="nav-link active" onclick="showSection('dashboard', this)"><i class="fas fa-home me-2"></i> Dashboard</a>
            <a class="nav-link" onclick="showSection('pelanggan', this)"><i class="fas fa-users me-2"></i> Pelanggan</a>
            <a class="nav-link" onclick="showSection('tagihan', this)"><i class="fas fa-cash-register me-2"></i> Kasir</a>
            <a class="nav-link" onclick="showSection('pengeluaran', this)"><i class="fas fa-wallet me-2"></i> Pengeluaran</a>
        </nav>
    </div>

    <div class="content">
        <div id="dashboard" class="menu-section active-section">
            <div class="card p-3 bg-success text-white text-center mb-3">
                <small>OMZET BERSIH</small>
                <h2 id="dash-total" class="fw-bold">Rp 0</h2>
            </div>
            <div class="row g-2">
                <div class="col-4"><div class="card p-2 text-center small">Internet<br><b id="dash-int">0</b></div></div>
                <div class="col-4"><div class="card p-2 text-center small">BRI<br><b id="dash-bri">0</b></div></div>
                <div class="col-4"><div class="card p-2 text-center small">Dana<br><b id="dash-dana">0</b></div></div>
            </div>
            <canvas id="myChart" class="mt-4" style="max-height:250px;"></canvas>
        </div>

        <div id="pelanggan" class="menu-section">
            <div class="d-flex justify-content-between mb-3"><h5>Data Pelanggan</h5><button class="btn btn-sm btn-success" onclick="resetForm()" data-bs-toggle="modal" data-bs-target="#modalTambah">+ Tambah</button></div>
            <div class="table-responsive"><table id="tablePelanggan" class="table table-sm w-100"><thead><tr><th>Nama</th><th>Paket</th><th>Aksi</th></tr></thead><tbody></tbody></table></div>
        </div>
        
        </div>
</div>

<div class="modal fade" id="modalTambah" tabindex="-1"><div class="modal-dialog"><form id="formTambah" class="modal-content">
    <div class="modal-body">
        <input type="hidden" id="edit-old-id">
        <input type="text" id="add-id" class="form-control mb-2" placeholder="ID Pelanggan" required>
        <input type="text" id="add-nama" class="form-control mb-2" placeholder="Nama" required>
        <input type="text" id="add-hp" class="form-control mb-2" placeholder="No HP" required>
        <input type="text" id="add-alamat" class="form-control mb-2" placeholder="Alamat" required>
        <select id="add-paket" class="form-select mb-2"><option>10 Mbps</option><option>20 Mbps</option></select>
        <input type="number" id="add-harga" class="form-control mb-2" placeholder="Harga" required>
        <select id="add-status" class="form-select mb-2"><option>Aktif</option><option>Non-Aktif</option></select>
    </div>
    <div class="modal-footer"><button type="submit" class="btn btn-success w-100">Simpan</button></div>
</form></div></div>

<script src="https://code.jquery.com/jquery-3.7.0.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.7/js/dataTables.bootstrap5.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbz1-ze0gihQMP9j54BQ0LuLU8lEu6uwEOab-mI306FYJaGFtCacadUZxcjbsy971vgv/exec"; 

    function showSection(id, el) {
        $('.menu-section').removeClass('active-section'); $('#' + id).addClass('active-section');
        $('.nav-link').removeClass('active'); $(el).addClass('active');
    }

    function loadAllData() {
        // Load Dashboard
        fetch(API_URL + "?action=getDashboardData").then(r => r.json()).then(res => {
            $('#dash-int').text(res.saldo.internet.toLocaleString());
            $('#dash-bri').text(res.saldo.bri.toLocaleString());
            $('#dash-dana').text(res.saldo.dana.toLocaleString());
            $('#dash-total').text("Rp " + (res.saldo.internet + res.saldo.bri + res.saldo.dana).toLocaleString());
            renderChart(res.grafik);
        });

        // Load Pelanggan
        fetch(API_URL + "?action=getPelanggan").then(r => r.json()).then(data => {
            const t = $('#tablePelanggan').DataTable(); t.clear();
            data.forEach(i => {
                let aksi = `<button class="btn btn-xs btn-danger py-0" onclick="hapusPelanggan('${i.ID_Pelanggan}')"><i class="fas fa-trash"></i></button>`;
                t.row.add([i.Nama, i.Paket, aksi]);
            });
            t.draw();
        });
    }

    function hapusPelanggan(id) {
        if(confirm("Hapus ID: " + id + "?")) {
            fetch(API_URL, { method: "POST", body: JSON.stringify({ target: "HapusPelanggan", id: id }) })
            .then(() => { alert("Terhapus"); loadAllData(); });
        }
    }

    $('#formTambah').on('submit', function(e) {
        e.preventDefault();
        const data = { 
            target: "Pelanggan", 
            old_id: $('#edit-old-id').val(), 
            id: $('#add-id').val(), 
            nama: $('#add-nama').val(), 
            hp: $('#add-hp').val(), 
            alamat: $('#add-alamat').val(), 
            paket: $('#add-paket').val(), 
            harga: $('#add-harga').val(), 
            status: $('#add-status').val() 
        };
        fetch(API_URL, { method: "POST", body: JSON.stringify(data) }).then(() => { $('#modalTambah').modal('hide'); loadAllData(); });
    });

    function renderChart(data) {
        const ctx = document.getElementById('myChart');
        new Chart(ctx, { type: 'line', data: { labels: ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'], datasets: [{ label: 'Omzet', data: data, borderColor: 'green' }] } });
    }

    $(document).ready(() => { $('#tablePelanggan').DataTable(); loadAllData(); });
</script>
</body>
</html>
